steps:
  - label: "🧪 Run Tests"
    command:
      # The agent's system Python is externally managed (PEP 668), so pip
      # cannot install into it; install into a venv for this build instead.
      # The hosted image has pip but not python3-venv (no ensurepip), so the
      # venv is created without pip and borrows the system one to install
      # its own; everything still installs into .venv.
      - python3 -m venv --without-pip --system-site-packages .venv
      - .venv/bin/python -m pip install --upgrade pip
      # No "pii" extra: Presidio loads a large spaCy model that the hosted
      # agent runs out of memory on (build #1284, killed at test_pii_masking).
      # GitHub Actions does not install it either; the PII tests skip.
      - .venv/bin/python -m pip install -e ".[dev,symbolic,server]"
      - .venv/bin/python -m pytest tests/ -x --timeout=30 -q --ignore=tests/advanced_audit --ignore=tests/security -p no:cacheprovider
    timeout_in_minutes: 10
