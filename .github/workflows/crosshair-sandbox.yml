name: CrossHair sandbox

# #431: CrossHair runs only inside its sandbox image. Build the image and run
# the sandbox tests, including the end-to-end test against the real container.
# With QWED_REQUIRE_CROSSHAIR_SANDBOX set, a missing image or Docker fails the
# job instead of skipping that test.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  crosshair-sandbox:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Build CrossHair sandbox image
      run: docker build -t qwed-crosshair-sandbox:0.0.101 docker/crosshair-sandbox

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,symbolic]"
        pip install pytest

    - name: Run CrossHair sandbox tests
      env:
        QWED_REQUIRE_CROSSHAIR_SANDBOX: "1"
      run: pytest tests/test_issue_431_crosshair_sandbox.py -v -rs -p no:cacheprovider
