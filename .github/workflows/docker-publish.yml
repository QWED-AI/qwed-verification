name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements-server.txt'
      - 'pyproject.toml'
      - 'src/**'
      - 'qwed_sdk/**'
      - '.github/workflows/docker-publish.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: qwedai/qwed-verification

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # latest on main push
            type=raw,value=latest,enable={{is_default_branch}}
            # version tag on release (e.g., v3.0.1 -> 3.0.1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # manual tag from workflow_dispatch
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            # SHA for traceability
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # The API server (#467). The default target is the GitHub Action,
          # which action.yml builds from the Dockerfile and never pulls.
          target: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # On release events the action otherwise tries to attach the SBOM as a
          # release asset, which needs `contents: write`. This job runs with the
          # least-privilege `contents: read`, and the SBOM is already retained via
          # the "Upload SBOM" workflow artifact below, so disable release upload.
          upload-release-assets: false

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Run Docker Scout vulnerability scan
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1
        if: github.event_name != 'pull_request'
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          sarif-file: docker-scout-results.sarif
          summary: true
        continue-on-error: true

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
