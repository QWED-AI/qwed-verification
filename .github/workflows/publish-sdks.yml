name: Publish SDKs

on:
  release:
    types: [published]
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: read

jobs:
  # ============================================
  # Versions to publish, read once from the checked-out sources
  # ============================================
  # The npm and crates.io jobs queue per version (see their concurrency keys):
  # two runs that would publish the same version wait for each other instead
  # of racing (queue: max keeps every waiting run, not only the newest), and
  # runs for different versions never wait on or cancel each other.
  # Build metadata (1.2.3+build) is rejected: npm drops it on publish, so the
  # "already published" check would compare different strings.
  versions:
    name: Read SDK versions
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.read.outputs.npm }}
      crate: ${{ steps.read.outputs.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read versions
        id: read
        run: |
          NPM=$(node -p "require('./sdk-ts/package.json').version")
          CRATE=$(python3 -c "import tomllib; print(tomllib.load(open('sdk-rust/Cargo.toml', 'rb'))['package']['version'])")
          for v in "$NPM" "$CRATE"; do
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Unexpected SDK version: $v"
              exit 1
            fi
          done
          echo "npm=$NPM" >> "$GITHUB_OUTPUT"
          echo "crate=$CRATE" >> "$GITHUB_OUTPUT"

  # ============================================
  # Python SDK → PyPI
  # ============================================
  publish-python:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    # Only run if PYPI_API_TOKEN exists
    if: ${{ vars.PYPI_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write   # OIDC trusted publisher - no hardcoded credential needed
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
          # OIDC trusted publisher: no token/password field required.
          # Configure at https://pypi.org/manage/project/qwed/settings/publishing/
        with:
          skip-existing: true

  # ============================================
  # TypeScript SDK → npm
  # ============================================
  publish-typescript:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    needs: versions
    concurrency:
      group: publish-sdks-npm-${{ needs.versions.outputs.npm }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: |
          cd sdk-ts
          npm ci
      
      - name: Build
        run: |
          cd sdk-ts
          npm run build
      
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.versions.outputs.npm }}
        # A version already on npm is skipped; any other failure fails the job.
        # (continue-on-error hid failed npm publishes from 7.2.1 to 7.2.3.)
        # Only a 404 from the registry counts as "not published yet"; if the
        # check itself fails, the job fails rather than guessing.
        run: |
          cd sdk-ts
          if PUBLISHED=$(npm view "@qwed-ai/sdk@$VERSION" version 2>"$RUNNER_TEMP/npm-view.err"); then
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "@qwed-ai/sdk@$VERSION is already on npm; nothing to publish."
              exit 0
            fi
          elif ! grep -q 'code E404' "$RUNNER_TEMP/npm-view.err"; then
            cat "$RUNNER_TEMP/npm-view.err"
            echo "::error::Could not check npm for @qwed-ai/sdk@$VERSION."
            exit 1
          fi
          npm publish --access public

  # ============================================
  # Rust SDK → crates.io
  # ============================================
  publish-rust:
    name: Publish Rust SDK
    runs-on: ubuntu-latest
    needs: versions
    concurrency:
      group: publish-sdks-crates-${{ needs.versions.outputs.crate }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.versions.outputs.crate }}
        # A version already on crates.io is skipped; any other failure fails the job.
        # Only a 404 counts as "not published yet"; transient errors are retried,
        # and if the check still fails, the job fails rather than guessing.
        run: |
          cd sdk-rust
          STATUS=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' -A "qwed-verification publish workflow (https://github.com/QWED-AI/qwed-verification)" "https://crates.io/api/v1/crates/qwed/$VERSION" || true)
          case "$STATUS" in
            200)
              echo "qwed $VERSION is already on crates.io; nothing to publish."
              exit 0
              ;;
            404) ;;
            *)
              echo "::error::Could not check crates.io for qwed $VERSION (HTTP $STATUS)."
              exit 1
              ;;
          esac
          cargo publish --allow-dirty

  # ============================================
  # Go SDK → Just needs tag (no publish step)
  # ============================================
  tag-go:
    name: Tag Go SDK
    runs-on: ubuntu-latest
    # Scoped to this job only (the global default stays contents: read): the Go
    # module lives in sdk-go/ with path .../sdk-go/v7, so the proxy resolves it
    # from a tag named sdk-go/vX.Y.Z — which this job has to push (#443).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify Go module
        run: |
          cd sdk-go
          go mod verify || true

      - name: Tag the Go SDK for the module proxy
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass these through env, not inline ${{ }}: GitHub expands template
          # expressions into the script source before the shell runs, so an
          # attacker-crafted release tag (e.g. v7.2.4-$(id)) would execute as
          # shell in this write-permissioned job. As env values they are plain
          # data, validated below.
          VERSION: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Only ever derive the Go tag from a real release tag (vX.Y.Z); never
          # from a branch name on a manual/workflow_dispatch run.
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unexpected release tag for Go SDK: $VERSION"
            exit 1
          fi
          # The module path pins the major version (.../sdk-go/vN). Refuse to tag
          # a release whose major doesn't match it: a vN+1 release before go.mod
          # is bumped would otherwise push a tag the proxy rejects and caches,
          # which can't be cleanly retracted. Fail closed; bump go.mod first.
          MOD_MAJOR=$(sed -n 's#^module .*/sdk-go/v\([0-9]\+\)$#\1#p' sdk-go/go.mod)
          TAG_MAJOR="${VERSION#v}"; TAG_MAJOR="${TAG_MAJOR%%.*}"
          if [ -z "$MOD_MAJOR" ] || [ "$MOD_MAJOR" != "$TAG_MAJOR" ]; then
            echo "::error::Release $VERSION does not match sdk-go module major v$MOD_MAJOR — bump sdk-go/go.mod first"
            exit 1
          fi
          GO_TAG="sdk-go/${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${GO_TAG}" >/dev/null 2>&1; then
            echo "Tag ${GO_TAG} already exists; nothing to do."
          else
            # Lightweight tag on the released commit; GITHUB_TOKEN pushes do not
            # re-trigger workflows, so this cannot recurse.
            git tag "${GO_TAG}" "${RELEASE_SHA}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "${GO_TAG}"
            echo "Created ${GO_TAG}"
          fi
          echo "✅ go get github.com/QWED-AI/qwed-verification/sdk-go/v${MOD_MAJOR}@${VERSION}"

  # ============================================
  # Summary
  # ============================================
  summary:
    name: Publish Summary
    needs: [publish-python, publish-typescript, publish-rust, tag-go]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "=== SDK Publish Results ==="
          echo "Python (PyPI):    ${{ needs.publish-python.result }}"
          echo "TypeScript (npm): ${{ needs.publish-typescript.result }}"
          echo "Rust (crates.io): ${{ needs.publish-rust.result }}"
          echo "Go (tagged):      ${{ needs.tag-go.result }}"
          echo ""
          echo "Note: Python publish uses the repository root package metadata (pyproject.toml)."
