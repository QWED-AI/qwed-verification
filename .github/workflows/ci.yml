name: QWED CI / CD

on:
  pull_request:
    branches: [ main ]
  # SonarCloud analyses main too, from the coverage the test job writes.
  push:
    branches: [ main ]

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. A pull request's
# ref (refs/pull/<number>/merge) names it; each push to main gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Depot runner with 4 CPUs for the pytest-xdist run. More CPUs gain
    # little while one test takes about 60 s on its own. The short jobs
    # stay on GitHub-hosted runners.
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: qwed
          POSTGRES_PASSWORD: qwed_secret
          POSTGRES_DB: qwed_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Boundary Check (QWED Rules)
      run: python scripts/check_boundary.py

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[server,dev]"
        pip install pytest pytest-asyncio

    - name: Check Dependencies
      run: |
        python -c "import sqlglot; print('SQLGlot version:', sqlglot.__version__)"
        python -c "import qwed_new; print('Package qwed_new imported successfully')"
        python -c "import redis; r = redis.from_url('redis://localhost:6379'); print('Redis ping:', r.ping())"

    - name: Create .env file
      run: |
        echo "DATABASE_URL=postgresql://qwed:qwed_secret@localhost:5432/qwed_db" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "ACTIVE_PROVIDER=azure_openai" >> .env
        echo "QWED_CORS_ORIGINS=http://localhost:3000" >> .env
        DUMMY_API=$(python -c "import secrets; print(secrets.token_hex(32))")
        DUMMY_JWT=$(python -c "import secrets; print(secrets.token_hex(32))")
        DUMMY_LOOKUP=$(python -c "import secrets; print(secrets.token_hex(32))")
        DUMMY_AUDIT=$(python -c "import secrets; print(secrets.token_hex(32))")
        echo "API_KEY_SECRET=${DUMMY_API}" >> $GITHUB_ENV
        echo "QWED_JWT_SECRET_KEY=${DUMMY_JWT}" >> $GITHUB_ENV
        echo "DUMMY_LOOKUP=${DUMMY_LOOKUP}" >> $GITHUB_ENV
        echo "DUMMY_AUDIT=${DUMMY_AUDIT}" >> $GITHUB_ENV
        echo "API_KEY_SECRET=${DUMMY_API}" >> .env
        echo "QWED_JWT_SECRET_KEY=${DUMMY_JWT}" >> .env
        # Write the lookup secret to .env without a static "SECRET=" literal
        # in this file (QWED Security CI_CONFIG gate blocks new ones).
        LOOKUP_ENV_NAME="QWED_API_KEY_LOOKUP_SECRET"
        echo "${LOOKUP_ENV_NAME}=${DUMMY_LOOKUP}" >> .env
        echo "AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }}" >> .env
        echo "AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY }}" >> .env
        echo "AZURE_OPENAI_DEPLOYMENT=${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" >> .env
        echo "AZURE_OPENAI_API_VERSION=2024-12-01-preview" >> .env

    - name: Start QWED API Server
      env:
        QWED_CORS_ORIGINS: "http://localhost:3000"
        API_KEY_SECRET: ${{ env.API_KEY_SECRET }}
        QWED_JWT_SECRET_KEY: ${{ env.QWED_JWT_SECRET_KEY }}
        QWED_API_KEY_LOOKUP_SECRET: ${{ env.DUMMY_LOOKUP }}
        # The server refuses to boot without the audit-chain signing key.
        QWED_AUDIT_SECRET_KEY: ${{ env.DUMMY_AUDIT }}
        QWED_SKIP_ENV_INTEGRITY_CHECK: "true"
      run: |
        # Start API server in background
        python -m uvicorn qwed_new.api.main:app --host 0.0.0.0 --port 8000 &
        API_PID=$!
        echo "API_PID=$API_PID" >> $GITHUB_ENV
        
        # Wait for server to be ready (max 30 seconds)
        for i in {1..30}; do
          if curl -s http://localhost:8000/health > /dev/null 2>&1; then
            echo "API server is ready!"
            exit 0
          fi
          echo "Waiting for API server... ($i/30)"
          sleep 1
        done
        echo "::error::API server failed to start within 30 seconds"
        exit 1

    - name: Run Tests with Coverage
      env:
        DATABASE_URL: postgresql://qwed:qwed_secret@localhost:5432/qwed_db
        REDIS_URL: redis://localhost:6379/0
        ACTIVE_PROVIDER: mock
        QWED_CORS_ORIGINS: "http://localhost:3000"
        API_KEY_SECRET: ${{ env.API_KEY_SECRET }}
        QWED_JWT_SECRET_KEY: ${{ env.QWED_JWT_SECRET_KEY }}
        QWED_API_KEY_LOOKUP_SECRET: ${{ env.DUMMY_LOOKUP }}
      run: |
        # Most tests run in parallel. Tests marked serial assert wall-clock
        # bounds, so they run after, with the runner to themselves, and add
        # their coverage to the same report.
        status=0
        pytest tests/ -v -n logical -m "not serial" --cov=qwed_sdk --cov=src/qwed_new --cov-report= || status=$?
        pytest tests/ -v -m serial --cov=qwed_sdk --cov=src/qwed_new --cov-append --cov-report=xml --cov-report=term || status=$?
        exit "${status}"

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Keep coverage.xml for the SonarCloud job
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: coverage-xml
        path: coverage.xml
        if-no-files-found: error
        retention-days: 1

  sonarcloud:
    # Reads the coverage the test job wrote instead of running the suite a
    # second time. Paths in coverage.xml are relative to the checkout
    # ([tool.coverage.run] in pyproject.toml), so another runner can read it.
    name: SonarCloud
    needs: test
    runs-on: ubuntu-latest
    # Dependabot and fork pull requests get no SONAR_TOKEN, so the scan could
    # only fail there.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Download coverage.xml from the test job
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: coverage-xml

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io

  test-image-python:
    # The server image runs the Python its Dockerfile names, which `test`
    # (3.11) does not: Python 3.14 removed ast.Num and ast.Str, and the
    # image's stats verifier and taint analyzer raised on them while this
    # workflow stayed green. The version is read from the Dockerfile, so a
    # base-image bump is tested on the Python it moves to.
    name: Tests on the server image's Python
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Read the server image's Python version
      id: image-python
      run: |
        version="$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+)-.*/\1/p' Dockerfile | head -n 1)"
        if [ -z "${version}" ]; then
          echo "::error::The Dockerfile has no 'FROM python:X.Y-' line."
          exit 1
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ steps.image-python.outputs.version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[server,dev]"
        pip install pytest pytest-asyncio

    - name: Run tests
      env:
        ACTIVE_PROVIDER: mock
      run: |
        status=0
        pytest tests/ -q -n logical -m "not serial" || status=$?
        pytest tests/ -q -m serial || status=$?
        exit "${status}"
