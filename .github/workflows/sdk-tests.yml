name: SDK Tests

on:
  push:
    branches: [main]
    paths:
      - 'qwed_sdk/**'
      - 'sdk-ts/**'
      - 'sdk-go/**'
      - 'sdk-rust/**'
  pull_request:
    branches: [main]
    paths:
      - 'qwed_sdk/**'
      - 'sdk-ts/**'
      - 'sdk-go/**'
      - 'sdk-rust/**'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  # ============================================
  # Python SDK
  # ============================================
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install SDK
        run: |
          pip install -e .
      
      - name: Test Import
        run: |
          python -c "from qwed_sdk import QWEDLocal; print('✅ Python SDK: Import OK')"
      
      - name: Check Types (optional)
        run: |
          pip install mypy
          mypy qwed_sdk --ignore-missing-imports || true

  # ============================================
  # TypeScript SDK
  # ============================================
  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Install Dependencies
        run: |
          cd sdk-ts
          npm ci
      
      - name: Typecheck
        run: |
          cd sdk-ts
          npm run typecheck
      
      - name: Build
        run: |
          cd sdk-ts
          npm run build
      
      - name: Lint
        run: |
          cd sdk-ts
          npm run lint
      
      - name: Test runner smoke (vitest starts, no tests yet)
        run: |
          cd sdk-ts
          npx vitest run --passWithNoTests

  # ============================================
  # TypeScript SDK consumer compat (oldest supported runtime)
  # ============================================
  # The toolchain above runs on Node 24 while engines stays >=18 by design
  # (devDeps never ship; see sdk-ts/README.md). This job guards that promise:
  # it builds with the Node 24 toolchain, then imports the built artifact on
  # Node 18 so a newer runtime API slipping into src/ fails CI instead of
  # reaching Node 18 consumers.
  typescript-consumer-compat:
    name: TypeScript SDK consumer compat (Node 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24 (build toolchain)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install + Build
        run: |
          cd sdk-ts
          npm ci
          npm run build

      - name: Set up Node.js 18 (oldest supported consumer runtime)
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Smoke-test built artifact on Node 18
        run: |
          cd sdk-ts
          node -e "import('./dist/index.mjs').then(m => { new m.QWEDClient({apiKey:'qwed_smoke'}); console.log('consumer smoke OK'); })"

  # ============================================
  # Go SDK
  # ============================================
  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'
      
      - name: Download Dependencies
        run: |
          cd sdk-go
          go mod download
      
      - name: Build
        run: |
          cd sdk-go
          go build -v .
      
      - name: Vet
        run: |
          cd sdk-go
          go vet ./...

  # ============================================
  # Rust SDK
  # ============================================
  rust-sdk:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      
      - name: Build
        run: |
          cd sdk-rust
          cargo build --verbose
      
      - name: Clippy (Lint)
        run: |
          cd sdk-rust
          cargo clippy -- -D warnings || true

  # ============================================
  # Summary
  # ============================================
  summary:
    name: SDK Test Summary
    needs: [python-sdk, typescript-sdk, go-sdk, rust-sdk]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "=== SDK Test Results ==="
          echo "Python:     ${{ needs.python-sdk.result }}"
          echo "TypeScript: ${{ needs.typescript-sdk.result }}"
          echo "Go:         ${{ needs.go-sdk.result }}"
          echo "Rust:       ${{ needs.rust-sdk.result }}"
