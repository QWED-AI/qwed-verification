# Dependabot version updates for qwed-verification.
#
# Security updates need no config (enabled in repo settings and already
# flowing). This file adds scheduled ROUTINE updates so healthy-but-stale
# dependencies also get bump PRs.
#
# Conventions (match history + sibling repos):
# - default labels/titles: Dependabot's own defaults already produce the
#   `dependencies` + ecosystem labels and `chore(deps):` prefix seen on the
#   merged security-update PRs, so nothing is set explicitly here.
# - one group per ecosystem: at most ~6 small PRs a month, not per-dep noise.
#   The only exceptions are in sdk-ts, where three deps are grouped alone: two
#   (typescript, vitest) have majors that current CI cannot run, and one
#   (@types/node) is deliberately held to the runtime the SDK targets. Without
#   the split, one bad member denies the whole npm group a chance to land.
# - monthly cadence runs on the 1st (Dependabot ignores `day` for monthly
#   schedules): CVE-driven bumps still arrive immediately via security
#   updates; these entries only cover non-vulnerable routine updates.
# - open-pull-requests-limit 5 mirrors qwed-security's dependabot config.
# - no `allow` restrictions: majors included, CI + review judge them.
# - cargo needs no committed lockfile: the fetcher requires only
#   Cargo.toml (`required_files_in?`) and includes Cargo.lock only when
#   present (`fetch_file_if_present`), so manifest-only sdk-rust/ still
#   gets routine updates (verified against dependabot-core main).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      pip-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/sdk-ts"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "vitest"
          - "@types/node"
      # typescript is grouped alone because its major is currently unadoptable
      # here: tsup's bundled rollup-plugin-dts crashes on the TS 7 compiler API
      # and no @typescript-eslint release accepts typescript >=6.1.0. Left in
      # npm-deps it fails ERESOLVE and blocks every other update in the group
      # from landing (see the closed #400). Isolated, it fails on its own and
      # the rest still merge. No `ignore` rule: the bump stays visible so it is
      # picked up as soon as the toolchain supports it.
      typescript:
        patterns:
          - "typescript"
      # vitest 5 is built on rolldown, whose native binding does not load on the
      # Node 20 runner used by sdk-tests.yml: `vitest run` dies with "Cannot find
      # module './rolldown-binding.wasi.cjs'". vitest 5 itself declares engines
      # ^22.12.0 || ^24.0.0 || >=26.0.0. `npm ci` still succeeds, so a green SDK
      # job says nothing about whether the test runner works — the same blind
      # spot as the `|| true` lint step #403 removed. Becomes adoptable when CI
      # moves to Node >=22.12 (and a test step actually runs it).
      vitest:
        patterns:
          - "vitest"
      # @types/node is not a "latest is better" dependency: it has to describe
      # the runtime the SDK is built and tested against (CI runs Node 20, and
      # package.json promises engines >=18.0.0). Taking 26.x would typecheck the
      # SDK against APIs that exist on none of those runtimes, so a clean
      # `tsc --noEmit` would stop meaning anything. The right moment to raise it
      # is alongside `engines.node` and the CI Node version, not on its own.
      types-node:
        patterns:
          - "@types/node"

  - package-ecosystem: "gomod"
    directory: "/sdk-go"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/sdk-rust"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      cargo-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      docker-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      github-actions-deps:
        patterns:
          - "*"
