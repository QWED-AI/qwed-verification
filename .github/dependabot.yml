# Dependabot version updates for qwed-verification.
#
# Security updates need no config (enabled in repo settings and already
# flowing). This file adds scheduled ROUTINE updates so healthy-but-stale
# dependencies also get bump PRs.
#
# Conventions (match history + sibling repos):
# - default labels/titles: Dependabot's own defaults already produce the
#   `dependencies` + ecosystem labels and `chore(deps):` prefix seen on the
#   merged security-update PRs, so nothing is set explicitly here.
# - one group per ecosystem: at most ~6 small PRs a month, not per-dep noise.
#   The only exceptions are in sdk-ts, where three deps are grouped alone: two
#   (typescript, vitest) have majors that current CI cannot install or build, and
#   one (@types/node) is deliberately held to the runtime the SDK targets. Without
#   the split, one bad member denies the whole npm group a chance to land (this is
#   what made #400 recur monthly). Confirmed by the first run after the split:
#   #406 and #407 arrived as lone PRs instead of bundling with adoptable updates.
# - monthly cadence runs on the 1st (Dependabot ignores `day` for monthly
#   schedules): CVE-driven bumps still arrive immediately via security
#   updates; these entries only cover non-vulnerable routine updates.
# - open-pull-requests-limit 5 mirrors qwed-security's dependabot config.
# - no `allow` restrictions: majors included, CI + review judge them.
# - cargo needs no committed lockfile: the fetcher requires only
#   Cargo.toml (`required_files_in?`) and includes Cargo.lock only when
#   present (`fetch_file_if_present`), so manifest-only sdk-rust/ still
#   gets routine updates (verified against dependabot-core main).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      pip-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/sdk-ts"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "vitest"
          - "@types/node"
      # typescript is grouped alone because its major is currently unadoptable
      # here: tsup's bundled rollup-plugin-dts crashes on the TS 7 compiler API
      # and no @typescript-eslint release accepts typescript >=6.1.0. Left in
      # npm-deps it fails ERESOLVE and blocks every other update in the group
      # from landing (see the closed #400). Isolated, it fails on its own and
      # the rest still merge. No `ignore` rule: the bump stays visible so it is
      # picked up as soon as the toolchain supports it.
      typescript:
        patterns:
          - "typescript"
      # vitest 5 does not install on the Node 20 runner used by sdk-tests.yml.
      # Measured on #406 with CI's own Node (20.20.2): "Install Dependencies" fails
      # with ERESOLVE and Typecheck/Build/Lint are skipped. vitest@5.0.2 declares
      # peerOptional @types/node "^22.0.0 || >=24.0.0" and this package pins
      # @types/node ^20.0.0, so npm cannot resolve. vitest 5 also declares engines
      # "^22.12.0 || ^24.0.0 || >=26.0.0", so Node 20 is outside its supported
      # range regardless of the peer conflict. (Locally, on Node 20.18.0, forcing
      # the install past the peer conflict gets further and then dies at runtime:
      # rolldown, which vitest 5 is built on, cannot load its native binding and
      # `vitest run` fails with "Cannot find module './rolldown-binding.wasi.cjs'".)
      # Adoptable only when all three hold: CI moves onto one of vitest 5's supported
      # ranges (^22.12.0, ^24.0.0 or >=26.0.0, which excludes Node 23.x and 25.x),
      # @types/node moves onto a range that satisfies its peerOptional, and a test
      # step actually runs vitest.
      vitest:
        patterns:
          - "vitest"
      # @types/node is not a "latest is better" dependency: it has to describe
      # the runtime the SDK is built and tested against (CI runs Node 20, and
      # package.json promises engines >=18.0.0). Taking 26.x would typecheck the
      # SDK against APIs that exist on none of those runtimes, so a clean
      # `tsc --noEmit` would stop meaning anything. The right moment to raise it
      # is alongside `engines.node` and the CI Node version, not on its own.
      # Do not treat this bump as unblocking vitest 5: 26.x does satisfy vitest
      # 5's peerOptional @types/node range, so taking it would turn the vitest PR's
      # ERESOLVE failure into a clean install on a Node 20 runner that vitest 5
      # does not support. CI has no test step to notice, so the job would go green.
      # A group is not a version guard. This does not stop Dependabot offering
      # 26.x, it only stops that offer riding in with updates that are adoptable,
      # so the lone @types/node PR still arrives and a human declines it. There
      # is deliberately no `ignore` condition: GitHub applies ignore rules to
      # security updates too, and suppressing a whole range would also silence a
      # future CVE fix that only exists above it.
      types-node:
        patterns:
          - "@types/node"

  - package-ecosystem: "gomod"
    directory: "/sdk-go"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/sdk-rust"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      cargo-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      docker-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      github-actions-deps:
        patterns:
          - "*"
