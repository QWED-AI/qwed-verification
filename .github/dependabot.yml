# Dependabot version updates for qwed-verification.
#
# Security updates need no config (enabled in repo settings and already
# flowing). This file adds scheduled ROUTINE updates so healthy-but-stale
# dependencies also get bump PRs.
#
# Conventions (match history + sibling repos):
# - default labels/titles: Dependabot's own defaults already produce the
#   `dependencies` + ecosystem labels and `chore(deps):` prefix seen on the
#   merged security-update PRs, so nothing is set explicitly here.
# - one group per ecosystem: at most ~6 small PRs a month, not per-dep noise.
#   The only exceptions are in sdk-ts, where three deps are grouped alone: two
#   (typescript, vitest) have majors that current CI cannot install or build, and
#   one (@types/node) is deliberately held to the runtime the SDK targets. Without
#   the split, one bad member denies the whole npm group a chance to land (this is
#   what made #400 recur monthly). Confirmed by the first run after the split:
#   #406 and #407 arrived as lone PRs instead of bundling with adoptable updates.
# - monthly cadence runs on the 1st (Dependabot ignores `day` for monthly
#   schedules): CVE-driven bumps still arrive immediately via security
#   updates; these entries only cover non-vulnerable routine updates.
# - open-pull-requests-limit 5 mirrors qwed-security's dependabot config.
# - no `allow` restrictions: majors included, CI + review judge them.
# - cargo needs no committed lockfile: the fetcher requires only
#   Cargo.toml (`required_files_in?`) and includes Cargo.lock only when
#   present (`fetch_file_if_present`), so manifest-only sdk-rust/ still
#   gets routine updates (verified against dependabot-core main).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      pip-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/sdk-ts"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "vitest"
          - "@types/node"
      # typescript is grouped alone because its major is currently unadoptable
      # here: tsup's bundled rollup-plugin-dts crashes on the TS 7 compiler API
      # and no @typescript-eslint release accepts typescript >=6.1.0. Left in
      # npm-deps it fails ERESOLVE and blocks every other update in the group
      # from landing (see the closed #400). Isolated, it fails on its own and
      # the rest still merge. No `ignore` rule: the bump stays visible so it is
      # picked up as soon as the toolchain supports it.
      typescript:
        patterns:
          - "typescript"
      # vitest 5 is adopted alongside the Node 24 bundle: CI runs Node 24,
      # @types/node is ^24 (satisfies vitest 5's peerOptional
      # "^22.0.0 || >=24.0.0"), and vitest 5's engines
      # "^22.12.0 || ^24.0.0 || >=26.0.0" cover the CI runtime. Kept as its
      # own group so a future vitest major that drops Node 24 fails alone
      # instead of blocking the adoptable npm-deps group. Note: sdk-ts has
      # no *.test.ts files yet, so CI gates vitest via install + typecheck /
      # build / lint, not via a `vitest run` step.
      vitest:
        patterns:
          - "vitest"
      # @types/node tracks the runtime the SDK is built and tested against:
      # CI runs Node 24 and package.json pins @types/node ^24. Taking 26.x
      # would typecheck against APIs that exist on none of the supported
      # runtimes, so the lone 26.x offer still arrives and a human declines
      # it until CI + @types/node move to 26 together. A group is not a
      # version guard. There is deliberately no `ignore` condition: GitHub
      # applies ignore rules to security updates too, and suppressing a
      # whole range would also silence a future CVE fix that only exists
      # above it.
      types-node:
        patterns:
          - "@types/node"

  - package-ecosystem: "gomod"
    directory: "/sdk-go"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/sdk-rust"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      cargo-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      docker-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      github-actions-deps:
        patterns:
          - "*"
