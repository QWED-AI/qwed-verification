apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwed-core
  namespace: qwed
  labels:
    app: qwed-core
spec:
  # NOTE (Greptile on PR #345 round 9): the in-memory rate limiter's state
  # is PROCESS-LOCAL, so with replicas > 1 the per-IP / per-key budgets are
  # effectively multiplied by the replica count (each pod admits its own
  # budget to the same client). Kept at 1 so the anonymous /auth/* budgets
  # are enforced exactly (Sentry on PR #345: replicas: 2 doubled them);
  # scale out only after moving the limiter to a shared store (Redis).
  replicas: 1
  selector:
    matchLabels:
      app: qwed-core
  template:
    metadata:
      labels:
        app: qwed-core
    spec:
      containers:
        - name: qwed-core
          # The API server image (#467). Before 7.3.1 this tag ran the GitHub
          # Action, not the server, so no earlier tag works here. 7.3.1 is the
          # first release that publishes the server image; until it is out,
          # this tag does not exist and the pod stays in ImagePullBackOff.
          image: docker.io/qwedai/qwed-verification:7.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: qwed-config
            - secretRef:
                name: qwed-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
