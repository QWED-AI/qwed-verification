apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwed-core
  namespace: qwed
  labels:
    app: qwed-core
spec:
  # NOTE (Greptile on PR #345 round 9): the in-memory rate limiter's state
  # is PROCESS-LOCAL, so with replicas > 1 the per-IP / per-key budgets are
  # effectively multiplied by the replica count (each pod admits its own
  # budget to the same client). Keep this at 1 for exact limits, or move
  # the limiter to a shared store (Redis) before scaling out.
  replicas: 2
  selector:
    matchLabels:
      app: qwed-core
  template:
    metadata:
      labels:
        app: qwed-core
    spec:
      containers:
        - name: qwed-core
          # Pinned to the last PUBLISHED image. Bump to 7.0.0 only after the
          # v7.0.0 release publishes docker.io/qwedai/qwed-verification:7.0.0
          # (referencing an unpublished tag causes ImagePullBackOff).
          image: docker.io/qwedai/qwed-verification:6.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: qwed-config
            - secretRef:
                name: qwed-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
