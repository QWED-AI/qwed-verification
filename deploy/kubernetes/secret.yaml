apiVersion: v1
kind: Secret
metadata:
  name: qwed-secrets
  namespace: qwed
type: Opaque
stringData:
  # IMPORTANT: Replace all placeholder values before deploying.
  # Consider using sealed-secrets or external-secrets-operator in production.
  DATABASE_URL: "__REPLACE_WITH_DATABASE_URL__"
  API_KEY_SECRET: "__REPLACE_WITH_API_KEY_SECRET__"
  # Keep these three stable: changing them invalidates issued tokens and API
  # keys, or breaks the signed audit chain. The lookup secret must differ
  # from the JWT secret.
  QWED_JWT_SECRET_KEY: "__REPLACE_WITH_QWED_JWT_SECRET_KEY__"
  QWED_API_KEY_LOOKUP_SECRET: "__REPLACE_WITH_QWED_API_KEY_LOOKUP_SECRET__"
  QWED_AUDIT_SECRET_KEY: "__REPLACE_WITH_QWED_AUDIT_SECRET_KEY__"
  AZURE_OPENAI_API_KEY: "__REPLACE_WITH_AZURE_OPENAI_API_KEY__"
  ANTHROPIC_API_KEY: "__REPLACE_WITH_ANTHROPIC_API_KEY__"
