apiVersion: v1
kind: Secret
metadata:
  name: qwed-secrets
  namespace: qwed
type: Opaque
stringData:
  # IMPORTANT: Replace all placeholder values before deploying.
  # Consider using sealed-secrets or external-secrets-operator in production.
  DATABASE_URL: "__REPLACE_WITH_DATABASE_URL__"
  API_KEY_SECRET: "__REPLACE_WITH_API_KEY_SECRET__"
  # Fill in the next three (empty values stop the server from issuing or
  # checking credentials). Keep them stable: changing them invalidates issued
  # tokens and API keys, or breaks the signed audit chain. The lookup secret
  # must differ from the JWT secret. Generate each with:
  #   python -c "import secrets; print(secrets.token_urlsafe(48))"
  QWED_JWT_SECRET_KEY: ""
  QWED_API_KEY_LOOKUP_SECRET: ""
  QWED_AUDIT_SECRET_KEY: ""
  AZURE_OPENAI_API_KEY: "__REPLACE_WITH_AZURE_OPENAI_API_KEY__"
  ANTHROPIC_API_KEY: "__REPLACE_WITH_ANTHROPIC_API_KEY__"
