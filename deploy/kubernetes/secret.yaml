apiVersion: v1
kind: Secret
metadata:
  name: qwed-secrets
  namespace: qwed
type: Opaque
stringData:
  # IMPORTANT: Fill in every value before deploying; this file ships empty.
  # Consider using sealed-secrets or external-secrets-operator in production.
  # Generate each secret separately with:
  #   python -c "import secrets; print(secrets.token_urlsafe(48))"
  #
  # e.g. postgresql://<user>:<password>@<host>:5432/<db>
  DATABASE_URL: ""
  API_KEY_SECRET: ""
  # The server refuses to start while the JWT or lookup secret is empty, and
  # fails closed on the first audit write while the audit secret is empty.
  # Keep all three stable: changing them invalidates issued tokens and API
  # keys, or breaks the signed audit chain. The lookup secret must differ
  # from the JWT secret.
  QWED_JWT_SECRET_KEY: ""
  QWED_API_KEY_LOOKUP_SECRET: ""
  QWED_AUDIT_SECRET_KEY: ""
  # Optional, recommended with more than one replica: the EC P-256
  # attestation signing key as PEM (a block scalar keeps its newlines).
  # Empty, each pod generates its own, and a pod cannot verify another's
  # attestations, nor its own after a restart (#319).
  QWED_ATTESTATION_SIGNING_KEY: ""
  # The LLM provider you use (see configmap.yaml ACTIVE_PROVIDER).
  AZURE_OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
