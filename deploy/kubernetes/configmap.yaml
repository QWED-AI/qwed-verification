apiVersion: v1
kind: ConfigMap
metadata:
  name: qwed-config
  namespace: qwed
data:
  # NOTE: DATABASE_URL moved to secret.yaml (contains credentials)
  QWED_CORS_ORIGINS: "http://localhost:3000"
  REDIS_URL: "redis://redis:6379/0"
  ACTIVE_PROVIDER: "azure_openai"
  AZURE_OPENAI_ENDPOINT: "https://your-resource.openai.azure.com/"
  AZURE_OPENAI_DEPLOYMENT: "gpt-4"
  AZURE_OPENAI_API_VERSION: "2023-05-15"
  # How long an attestation the server issues stays valid, in seconds: 60
  # to 2592000 (30 days); 86400 is the default (#319). Anything else stops
  # the server at startup.
  QWED_ATTESTATION_TTL_SECONDS: "86400"
  # Maths limits (#591), optional: unset keeps the default shown. Workers:
  # a whole number, at least 1. Time limit per job: 0.001 to 3600 seconds.
  # Waiting jobs and the per-worker memory limit in MB (0 turns it off):
  # whole numbers, at least 0. Batch maths budget per job, wall-clock from
  # the job's start: at least 0 seconds. Anything else stops the server at
  # startup. The root .env.example describes each one.
  # QWED_MATH_WORKERS: "2"
  # QWED_MATH_TIMEOUT_SECONDS: "10"
  # QWED_MATH_MAX_WAITING: "32"
  # QWED_MATH_WORKER_MEMORY_MB: "2048"
  # QWED_BATCH_MATH_BUDGET_SECONDS: "120"
