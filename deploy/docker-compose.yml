
# Run from the repository root:
#   cp deploy/.env.example deploy/.env   # then fill in every value
#   docker compose -f deploy/docker-compose.yml up -d
# Paths below are relative to this file (deploy/).
services:
  qwed-core:
    build:
      context: ..
      dockerfile: Dockerfile
      target: server
    image: qwedai/qwed-verification:local
    container_name: qwed_core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - QWED_CORS_ORIGINS=${QWED_CORS_ORIGINS:?set QWED_CORS_ORIGINS}
      - API_KEY_SECRET=${API_KEY_SECRET:?set API_KEY_SECRET}
      # Keep these three stable across restarts: changing the JWT or lookup
      # secret invalidates issued tokens and API keys, and the audit secret
      # signs the audit chain. The lookup secret must differ from the JWT one.
      - QWED_JWT_SECRET_KEY=${QWED_JWT_SECRET_KEY:?set QWED_JWT_SECRET_KEY}
      - QWED_API_KEY_LOOKUP_SECRET=${QWED_API_KEY_LOOKUP_SECRET:?set QWED_API_KEY_LOOKUP_SECRET}
      - QWED_AUDIT_SECRET_KEY=${QWED_AUDIT_SECRET_KEY:?set QWED_AUDIT_SECRET_KEY}
      # Attestation signing key (#319), optional: unset, the server generates
      # one per process and its attestations do not survive a restart. Set
      # one: the PEM, or the path of a key file mounted into the container.
      - QWED_SIGNING_KEY=${QWED_SIGNING_KEY:-}
      - QWED_SIGNING_KEY_FILE=${QWED_SIGNING_KEY_FILE:-}
      # All-tenant metrics operator allowlist (issue #337): user IDs permitted
      # to read /metrics and /metrics/prometheus. Unset = deny every caller,
      # including the Prometheus scraper. Set it to the scraper identity's
      # user ID and mint that identity an API key for prometheus.yml.
      - QWED_METRICS_OPERATOR_USER_IDS=${QWED_METRICS_OPERATOR_USER_IDS:-}
    ports:
      - "8000:8000"
    volumes:
      - qwed-data:/var/lib/qwed
    healthcheck:
      # The image has no curl; use its own Python.
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: qwed_postgres
    # Only Postgres's own settings, not the whole deploy/.env: the server's
    # secrets stay out of this container. A name without a value is read
    # from deploy/.env. The postgres image refuses to initialise a database
    # while the password is empty.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-qwed}
      - POSTGRES_DB=${POSTGRES_DB:-qwed_db}
      - POSTGRES_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qwed_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenTelemetry Collector + Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: qwed_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: qwed_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"  # Prometheus UI
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:10.2.2
    container_name: qwed_grafana
    # Only Grafana's own settings, not the whole deploy/.env. A name without a
    # value is read from deploy/.env.
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?set GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD
      - GF_USERS_ALLOW_SIGN_UP=false
    # Grafana would fall back to its default admin/admin while the admin
    # password is empty, so refuse to start instead, then hand over to the
    # image's own entrypoint (/run.sh).
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$${GF_SECURITY_ADMIN_PASSWORD}" ] || { echo "deploy/.env: GF_SECURITY_ADMIN_PASSWORD is empty" >&2; exit 1; }; exec /run.sh'
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"  # Grafana UI
    depends_on:
      - prometheus
      - jaeger
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qwed-data:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:
