[package]
name = "qwed"
version = "7.3.0"
edition = "2021"
authors = ["QWED-AI"]
description = "Rust SDK for QWED Verification Protocol"
license = "Apache-2.0"
repository = "https://github.com/QWED-AI/qwed-verification"
keywords = ["qwed", "verification", "ai", "llm", "trust"]
categories = ["api-bindings", "development-tools"]

[dependencies]
# Verifying attestations (#319): ES256 over P-256, SHA-256, base64url.
base64 = "0.23"
p256 = { version = "0.14", features = ["ecdsa"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["net", "io-util", "time"] }
tokio-test = "0.4"

