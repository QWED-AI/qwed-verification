# Copy to config.yaml (git-ignored) and set your QWED API URL and key.
api:
  url: http://localhost:8000
  key: YOUR_QWED_API_KEY
  timeout: 30
  max_retries: 3
test_priorities:
  critical:
  - context_aware_detection
  - sql_injection
  - rce_detection
  - dynamic_import
  - reflection_execution
  - dataframe_eval_injection
  - exec_in_stats
  - union_injection
  - blind_injection
  - nosql_injection
  - knowledge_cutoff
  - contradictions
  high:
  - crypto_misuse
  - weak_hashing
  - ambiguity_detection
  - domain_restrictions
  - schema_validation
  - quantifier_handling
  - statistical_correctness
  - large_dataset_performance
  - schema_validation
  - query_complexity
  - hallucination_detection
  - source_validation
  - ocr_accuracy
  - claim_image_alignment
  medium:
  - performance_tests
  - edge_cases
  - integration_tests
performance:
  max_concurrent_requests: 100
  max_file_size_lines: 10000
  timeout_threshold_seconds: 30
  large_dataset_rows: 1000000
reporting:
  output_dir: ./test_results
  formats:
  - json
  - markdown
  - html
  save_failed_tests: true
  save_detailed_logs: true
engines:
  code:
    enabled: true
    test_count: 50
  math:
    enabled: true
    test_count: 45
  logic:
    enabled: true
    test_count: 40
  stats:
    enabled: true
    test_count: 35
  sql:
    enabled: true
    test_count: 40
  fact:
    enabled: true
    test_count: 30
  image:
    enabled: true
    test_count: 25
